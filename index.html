<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaga</title>
<style>
  /* 아이폰 사파리는 -webkit- 접두사를 붙여야 알아듣는다: 버튼을 누르다 글자가 파랗게 선택(블록)되거나
     길게 눌러 복사 메뉴가 뜨지 않게. 입력칸은 그대로 선택·붙여넣기 되게 둔다 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea, [contenteditable] { -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }

  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: monospace; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { background: #000; max-height: 100vh; max-height: 100dvh; max-width: 100vw; border: 1px solid #223; touch-action: none; box-sizing: border-box; }
</style>
</head>
<body>
<canvas id="c" width="480" height="640"></canvas>
<script src="logic.js"></script>
<script>
// 오락실 튜토리얼이 '진짜로 일어난 일'을 알아채는 신호 (arcade/public/tutorial.js 가 듣는다. 튜토리얼이 아니면 아무도 안 듣는다)
const tutorialSignal = (type) => window.dispatchEvent(new CustomEvent('arcade:tutorial', { detail: { type } }));
// 움직임 신호: 위치가 바뀐 거리가 step 이상 쌓일 때마다 'move' (방향키·터치·마우스로 실제로 움직였는지)
let tutorialLast = null, tutorialDist = 0;
function tutorialMoved(x, y, step) {
  if (tutorialLast) { tutorialDist += Math.abs(x - tutorialLast[0]) + Math.abs(y - tutorialLast[1]); if (tutorialDist >= step) { tutorialDist = 0; tutorialSignal('move'); } }
  tutorialLast = [x, y];
}
// 규칙(편대·급강하·광선·구출·점수·스테이지)은 logic.js 의 LOGIC_GALAGA. 여기서는 그리기·소리·입력만
const L = LOGIC_GALAGA;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, PI = Math.PI;

// ───────── 입력 ─────────
const keys = {}, tapped = {};
let touchX = null, paused = false, muted = false;
addEventListener('keydown', e => {
  audio();
  keys[e.code] = true; tapped[e.code] = true;
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if ((e.code === 'Enter' || e.code === 'Space') && (state === 'title' || (state === 'over' && overT > 1.5))) start();
  if (e.code === 'KeyP' && state === 'play') paused = !paused;
  if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { touchX = null; for (const k in keys) keys[k] = false; if (state === 'play') paused = true; });
// 다른 앱·탭에 갔다 오면 멈춰 있게 (오른쪽 위 Ⅱ 버튼·P 키로도 멈춤, 탭하면 이어서)
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });
const PAUSE_BTN = { x: W - 44, y: 8, w: 36, h: 30 };
function canvasXY(cx, cy) { const r = cv.getBoundingClientRect(); return [(cx - r.left) / r.width * W, (cy - r.top) / r.height * H]; }
// 눌러서 멈추거나 이어 가면 true (그 터치는 비행기 조작에 쓰지 않는다)
function pauseTap(cx, cy) {
  if (state !== 'play') return false;
  if (paused) { paused = false; return true; }
  const [x, y] = canvasXY(cx, cy);
  if (x > PAUSE_BTN.x - 30 && y < PAUSE_BTN.y + PAUSE_BTN.h + 24) { paused = true; touchX = null; return true; }
  return false;
}

function pointer(x) { const r = cv.getBoundingClientRect(); touchX = (x - r.left) / r.width * W; }
cv.addEventListener('mousedown', e => { audio(); if (pauseTap(e.clientX, e.clientY)) return; if (state === 'title' || (state === 'over' && overT > 1.5)) start(); pointer(e.clientX); });
addEventListener('mousemove', e => { if (e.buttons & 1) pointer(e.clientX); else touchX = null; });
addEventListener('mouseup', () => touchX = null);
let pauseTouch = false;   // 일시정지 버튼을 누른 손가락은 떼기 전까지 비행기를 움직이지 않는다
function touch(e) {
  audio();
  e.preventDefault();
  if (e.type === 'touchstart' && e.touches.length === 1) pauseTouch = pauseTap(e.touches[0].clientX, e.touches[0].clientY);
  if (pauseTouch) { if (!e.touches.length) pauseTouch = false; return; }
  if (e.touches.length) pointer(e.touches[0].clientX); else touchX = null;
  if (e.type === 'touchstart' && (state === 'title' || (state === 'over' && overT > 1.5))) start();
  e.preventDefault();
}
['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(t => cv.addEventListener(t, touch, { passive: false }));

// ───────── 사운드 ─────────
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function sfx(f0, f1, dur, type = 'square', vol = 0.05, delay = 0) {
  if (!AC || muted) return;
  vol = Math.min(0.35, vol * 4);
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + delay;
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(t + dur);
  } catch (_) {}
}
// 간단한 멜로디: [주파수, 길이] 목록
function jingle(notes, type = 'square', vol = 0.05) {
  let t = 0;
  for (const [f, d] of notes) { if (f) sfx(f, f, d * 0.9, type, vol, t); t += d; }
}
const N = { C5: 523, D5: 587, E5: 659, F5: 698, G5: 784, A5: 880, B5: 988, C6: 1047, E6: 1319, G4: 392, E4: 330 };

// ───────── 상태 ─────────
let state = 'title';      // title | play | over
let G;                    // 규칙 상태 (LOGIC_GALAGA.newGame)
let particles = [], pops = [];
let hi = 0, overT = 0;
try { hi = +localStorage.getItem('galagaHi') || 0; } catch (_) {}

const stars = Array.from({ length: 90 }, () => ({
  x: Math.random() * W, y: Math.random() * H, s: 0.5 + Math.random() * 1.8,
  c: ['#fff', '#8cf', '#f88', '#ff8'][Math.floor(Math.random() * 4)]
}));

function start() {
  G = L.newGame();
  particles = []; pops = [];
  paused = false; state = 'play';
  handleEvents();
}

// ───────── 이펙트 ─────────
function boom(x, y, color, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 2 * PI, s = 40 + Math.random() * 170;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.5, color });
  }
}
function gameOver() {
  state = 'over'; overT = 0;
  jingle([[N.G5,.25],[N.E5,.25],[N.C5,.25],[N.G4,.6]], 'sawtooth');
  try { localStorage.setItem('galagaHi', hi); } catch (_) {}
}

// 규칙이 남긴 일들 → 소리·폭발·점수 글씨
function handleEvents() {
  for (const e of G.events.splice(0)) {
    tutorialSignal(e.type);
    switch (e.type) {
      case 'start': jingle([[N.G4,.12],[N.C5,.12],[N.E5,.12],[N.G5,.12],[N.E5,.12],[N.G5,.12],[N.C6,.3],[0,.05],[N.G5,.12],[N.A5,.12],[N.B5,.12],[N.C6,.4]]); break;
      case 'stage': jingle(e.challenge ? [[N.E5,.1],[N.G5,.1],[N.C6,.1],[N.E6,.25]] : [[N.C5,.1],[N.E5,.1],[N.G5,.1],[N.C6,.25]]); break;
      case 'extraLife': sfx(600, 1400, 0.4, 'square', 0.06); break;
      case 'enemyShot': sfx(500, 250, 0.08, 'square', 0.02); break;
      case 'beam': sfx(300, 900, 0.5, 'sawtooth', 0.04); break;
      case 'beamHum': sfx(700 + Math.random() * 300, 400, 0.05, 'sawtooth', 0.02); break;
      case 'captureStart': sfx(900, 200, 1.2, 'sawtooth', 0.05); break;
      case 'kill':
        pops.push({ x: e.x, y: e.y, t: 0.9, txt: '' + e.pts });
        boom(e.x, e.y, ['#fd4', '#f55', '#4d8'][e.kind]);
        sfx(240, 40, 0.25, 'sawtooth', 0.06);
        break;
      case 'bossHurt': sfx(400, 200, 0.12, 'square', 0.05); boom(e.x, e.y, '#b4f', 5); break;
      case 'dualLost': boom(e.x, e.y, '#8cf', 26); sfx(200, 30, 0.5, 'sawtooth', 0.08); break;
      case 'playerHit': boom(e.x, e.y, '#8cf', 34); boom(e.x, e.y, '#fff', 14); sfx(160, 25, 0.8, 'sawtooth', 0.09); break;
      case 'shoot': sfx(1100, 350, 0.09, 'square', 0.03); break;
      case 'dual': sfx(500, 1500, 0.5, 'square', 0.06); break;
      case 'perfect': jingle([[N.C5,.1],[N.E5,.1],[N.G5,.1],[N.C6,.1],[N.E6,.1],[N.G5,.1],[N.C6,.1],[N.E6,.4]]); break;
      case 'over': gameOver(); break;
    }
  }
  if (G.score > hi) hi = G.score;
}

// ───────── 업데이트 ─────────
function update(dt) {
  for (const s of stars) { s.y += s.s * 35 * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  if (state === 'over') { overT += dt; return; }
  if (state !== 'play' || paused) return;
  for (const p of pops) p.t -= dt;
  pops = pops.filter(p => p.t > 0);
  const input = {
    left: keys.ArrowLeft || keys.KeyA || tapped.ArrowLeft || tapped.KeyA,
    right: keys.ArrowRight || keys.KeyD || tapped.ArrowRight || tapped.KeyD,
    fire: keys.Space || tapped.Space,
    touchX,
  };
  for (const k in tapped) delete tapped[k];
  L.update(G, dt, input);
  tutorialMoved(G.player.x, G.player.y, 20);
  handleEvents();
}

// ───────── 그리기 ─────────
function text(s, x, y, size = 16, color = '#fff', align = 'center') {
  ctx.fillStyle = color; ctx.font = `bold ${size}px monospace`; ctx.textAlign = align;
  ctx.fillText(s, x, y);
}

function drawShip(x, y, color, flip) {
  ctx.save(); ctx.translate(x, y); if (flip) ctx.scale(1, -1);
  const wing = color || '#e33';
  ctx.fillStyle = wing;
  ctx.beginPath(); ctx.moveTo(-3, -2); ctx.lineTo(-15, 10); ctx.lineTo(-15, 15); ctx.lineTo(-4, 11); ctx.fill();
  ctx.beginPath(); ctx.moveTo(3, -2); ctx.lineTo(15, 10); ctx.lineTo(15, 15); ctx.lineTo(4, 11); ctx.fill();
  ctx.fillStyle = '#eee';
  ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(5, 4); ctx.lineTo(6, 14); ctx.lineTo(-6, 14); ctx.lineTo(-5, 4); ctx.fill();
  ctx.fillStyle = '#28f'; ctx.fillRect(-2, -8, 4, 8);
  ctx.fillStyle = '#e33'; ctx.fillRect(-2, 6, 4, 6);
  ctx.restore();
}

function drawEnemy(e) {
  const flap = Math.floor(performance.now() / 350) % 2 ? 3 : -2;
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.ang - PI / 2);
  if (e.type === 0) {                     // 벌
    ctx.fillStyle = '#39f';
    ctx.beginPath(); ctx.moveTo(-3, -6); ctx.lineTo(-13, -8 + flap); ctx.lineTo(-12, 3); ctx.lineTo(-3, 5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(3, -6); ctx.lineTo(13, -8 + flap); ctx.lineTo(12, 3); ctx.lineTo(3, 5); ctx.fill();
    ctx.fillStyle = '#fd3'; ctx.beginPath(); ctx.ellipse(0, 0, 5, 9, 0, 0, 2 * PI); ctx.fill();
    ctx.fillStyle = '#f33'; ctx.fillRect(-3, 4, 2, 3); ctx.fillRect(1, 4, 2, 3);
  } else if (e.type === 1) {              // 나비
    ctx.fillStyle = '#48f';
    ctx.beginPath(); ctx.moveTo(-3, -8); ctx.lineTo(-14, -10 + flap); ctx.lineTo(-15, 0); ctx.lineTo(-11, 9); ctx.lineTo(-3, 4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(3, -8); ctx.lineTo(14, -10 + flap); ctx.lineTo(15, 0); ctx.lineTo(11, 9); ctx.lineTo(3, 4); ctx.fill();
    ctx.fillStyle = '#f33'; ctx.beginPath(); ctx.ellipse(0, 0, 4.5, 10, 0, 0, 2 * PI); ctx.fill();
    ctx.fillStyle = '#ff6'; ctx.fillRect(-3, 5, 2, 3); ctx.fillRect(1, 5, 2, 3);
  } else {                                // 보스 갤러가
    const hurt = e.hp < 2;
    ctx.fillStyle = hurt ? '#a5f' : '#4d6';
    ctx.beginPath(); ctx.moveTo(-4, -8); ctx.lineTo(-16, -9 + flap); ctx.lineTo(-17, 2); ctx.lineTo(-11, 10); ctx.lineTo(-4, 6); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4, -8); ctx.lineTo(16, -9 + flap); ctx.lineTo(17, 2); ctx.lineTo(11, 10); ctx.lineTo(4, 6); ctx.fill();
    ctx.fillStyle = hurt ? '#66f' : '#3af'; ctx.beginPath(); ctx.ellipse(0, 0, 7, 11, 0, 0, 2 * PI); ctx.fill();
    ctx.fillStyle = '#fd3';
    ctx.beginPath(); ctx.moveTo(-7, 8); ctx.lineTo(-4, 15); ctx.lineTo(-1, 8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(7, 8); ctx.lineTo(4, 15); ctx.lineTo(1, 8); ctx.fill();
    ctx.fillStyle = '#f33'; ctx.fillRect(-3, 3, 2, 3); ctx.fillRect(1, 3, 2, 3);
  }
  if (e.carry) { ctx.translate(0, -26); drawShip(0, 0, '#e33', true); }
  ctx.restore();
}

function drawBeam(e) {
  const P = G.player, top = e.y + 12, bot = P.y + 26;
  const grow = Math.min(1, e.bt / 0.5), len = (bot - top) * (e.bt > 2.2 ? Math.max(0, (2.6 - e.bt) / 0.4) : grow);
  const hw = y => 8 + (y - top) * 0.16;
  const n = 9, off = Math.floor(G.t * 14);
  for (let i = 0; i < n; i++) {
    const y0 = top + len * i / n, y1 = top + len * (i + 1) / n;
    ctx.fillStyle = (i + off) % 2 ? 'rgba(80,200,255,0.55)' : 'rgba(200,240,255,0.4)';
    ctx.beginPath(); ctx.moveTo(e.x - hw(y0), y0); ctx.lineTo(e.x + hw(y0), y0); ctx.lineTo(e.x + hw(y1), y1); ctx.lineTo(e.x - hw(y1), y1); ctx.fill();
  }
}

function drawFlags(x, y, stage) {
  let big = Math.floor(stage / 10), mid = Math.floor((stage % 10) / 5), one = stage % 5;
  const icons = [];
  for (let i = 0; i < big; i++) icons.push(3);
  for (let i = 0; i < mid; i++) icons.push(2);
  for (let i = 0; i < one; i++) icons.push(1);
  let cx = x;
  for (const k of icons.reverse()) {
    const w = k === 1 ? 8 : k === 2 ? 12 : 16;
    cx -= w + 2;
    ctx.fillStyle = k === 3 ? '#ff3' : k === 2 ? '#f55' : '#4cf';
    ctx.fillRect(cx, y - 14, 2, 14);
    ctx.beginPath(); ctx.moveTo(cx + 2, y - 14); ctx.lineTo(cx + w, y - 10); ctx.lineTo(cx + 2, y - 6); ctx.fill();
  }
}

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  for (const s of stars) { ctx.fillStyle = s.c; ctx.globalAlpha = 0.25 + s.s / 3; ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.globalAlpha = 1;

  if (state === 'title') { drawTitle(); return; }

  for (const e of G.enemies) if (e.state !== 'wait') { drawEnemy(e); }
  for (const e of G.enemies) if (e.state === 'beam') drawBeam(e);

  ctx.fillStyle = '#ff6';
  for (const b of G.bullets) ctx.fillRect(b.x - 1.5, b.y - 8, 3, 13);
  ctx.fillStyle = '#f66';
  for (const b of G.ebullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, 2 * PI); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(b.x - 1, b.y - 1, 2, 2); ctx.fillStyle = '#f66'; }
  for (const r of G.rescues) { ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.t * 8); drawShip(0, 0, '#e33'); ctx.restore(); }

  const P = G.player;
  if (P.cap) { ctx.save(); ctx.translate(P.cx, P.cy); ctx.rotate(P.spin); drawShip(0, 0, '#e33'); ctx.restore(); }
  else if (P.alive && !(P.inv > 0 && Math.floor(performance.now() / 90) % 2)) {
    if (P.dual) { drawShip(P.x - 14, P.y); drawShip(P.x + 14, P.y); } else drawShip(P.x, P.y);
  }
  for (const p of particles) { ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3); }
  ctx.globalAlpha = 1;
  for (const p of pops) text(p.txt, p.x, p.y, 12, '#5ff');

  // HUD
  text('1UP', 50, 16, 14, '#f33'); text('' + G.score, 50, 32, 14, '#fff');
  text('HIGH SCORE', W / 2, 16, 14, '#f33'); text('' + hi, W / 2, 32, 14, '#fff');
  for (let i = 0; i < G.lives - 1 && i < 8; i++) drawShip(22 + i * 34, H - 22, '#e33');
  drawFlags(W - 8, H - 8, G.stage);

  if (state === 'over') {
    text('GAME OVER', W / 2, 250, 36, '#f33');
    if (overT > 0.8) {
      text('-- RESULTS --', W / 2, 320, 18, '#4cf');
      text('SHOTS FIRED   ' + G.shots, W / 2, 350, 16);
      text('NUMBER OF HITS ' + G.hits, W / 2, 374, 16);
      text('HIT-MISS RATIO ' + (G.shots ? (G.hits / G.shots * 100).toFixed(1) : '0.0') + '%', W / 2, 398, 16, '#ff6');
    }
    if (overT > 1.5) text('ENTER / CLICK TO RESTART', W / 2, 460, 14, '#fd4');
    return;
  }
  if (G.t < 2.6 && G.phase === 'play') text(G.banner, W / 2, H / 2 + 20, 26, G.challenge ? '#ff3' : '#4cf');
  if (!P.alive && !P.cap && G.lives > 0) text('READY', W / 2, H / 2 + 60, 24, '#4cf');
  if (G.banner2T > 0) text(G.banner2, W / 2, H / 2 + 100, 20, '#f55');
  if (G.phase === 'result') {
    text('NUMBER OF HITS  ' + G.chHits, W / 2, 300, 20, '#4cf');
    if (G.chHits >= 40) text('PERFECT !   SPECIAL BONUS 10000', W / 2, 340, 18, '#ff3');
    else text('BONUS  ' + G.chHits * 100, W / 2, 340, 18, '#ff3');
  }
  // 일시정지 버튼
  ctx.strokeStyle = '#4cf'; ctx.lineWidth = 2; ctx.strokeRect(PAUSE_BTN.x, PAUSE_BTN.y, PAUSE_BTN.w, PAUSE_BTN.h);
  text(paused ? '▶' : 'Ⅱ', PAUSE_BTN.x + PAUSE_BTN.w / 2, PAUSE_BTN.y + 21, 16, '#4cf');
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    text('PAUSE', W / 2, H / 2 - 70, 32, '#fff');
    text('TAP / P TO RESUME', W / 2, H / 2 - 36, 14, '#fd4');
  }
  if (muted) text('MUTE', W - 10, 54, 12, '#888', 'right');
}

function drawTitle() {
  text('GALAGA', W / 2, 210, 60, '#4cf');
  const t = performance.now() / 1000;
  const demo = [{ type: 2, hp: 2 }, { type: 1, hp: 1 }, { type: 0, hp: 1 }];
  demo.forEach((d, i) => drawEnemy({ ...d, x: W / 2 - 90 + i * 90, y: 270 + Math.sin(t * 2 + i) * 6, ang: PI / 2, carry: false }));
  text('← →  이동      SPACE  발사      P  일시정지', W / 2, 350, 14);
  text('PUSH ENTER / SPACE / CLICK', W / 2, 410, 18, Math.floor(t * 2) % 2 ? '#fd4' : '#a80');
  text('보스에게 잡힌 기체를 구출하면 듀얼 파이터!', W / 2, 460, 13, '#8f8');
  text('HIGH SCORE ' + hi, W / 2, 520, 16, '#f33');
  text('M  소리 켜기/끄기', W / 2, 560, 12, '#888');
}

// rAF가 멈추는 환경에서도 돌도록 타이머 기반 루프
let last = performance.now();
setInterval(() => {
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
}, 1000 / 60);
</script>
</body>
</html>
